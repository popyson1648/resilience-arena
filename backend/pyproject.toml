[project]
name = "resilience-arena-backend"
version = "0.1.0"
description = "Resilience Arena backend: FastAPI + ADK incident-response simulator"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.5.0",
    "fastapi>=0.133",
    "uvicorn>=0.34",
    "pydantic>=2.12",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
