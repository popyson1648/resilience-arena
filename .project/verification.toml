version = 2

# Phases start disabled so a new project's first CI run passes.
# Enable a phase and set its command as you add the matching tool.
# The broad repository input is conservative: every known change affects every enabled phase.

[selection]
selector_paths = [
  ".project/verification.toml",
  ".template/verification.toml",
  "scripts/verify.py",
]
global_paths = [
  ".github/workflows/ci.yml",
  ".template/ci.yml",
  ".pre-commit-config.yaml",
  ".template/pre-commit-config.yaml",
]

[inputs.repository]
paths = ["**"]
depends_on = []

[inputs.backend]
paths = ["backend/**"]
depends_on = []

[inputs.frontend]
paths = ["frontend/**"]
depends_on = []

[phases.secrets]
enabled = false
command = ""
reason = "gitleaks is not installed in the local or CI environments yet; see .project/testing.md."
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]

[phases.format]
enabled = true
command = "backend/.venv/bin/ruff format --check backend"
when = ["changed", "scheduled", "manual"]
inputs = ["backend"]

[phases.lint]
enabled = true
command = "backend/.venv/bin/ruff check backend && cd frontend && npm run lint"
when = ["changed", "scheduled", "manual"]
inputs = ["backend", "frontend"]

[phases.typecheck]
enabled = true
command = "cd frontend && npm run typecheck"
when = ["changed", "scheduled", "manual"]
inputs = ["frontend"]

[phases.build]
enabled = true
command = "cd frontend && npm run build"
when = ["changed", "scheduled", "manual"]
inputs = ["frontend"]

[phases.test_unit]
enabled = true
command = "cd backend && .venv/bin/python -m pytest -q"
when = ["changed", "scheduled", "manual"]
inputs = ["backend"]

[phases.test_integration]
enabled = false
command = ""
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]

[phases.test_e2e]
enabled = false
command = ""
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]

[phases.test_component]
enabled = false
command = ""
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]

[phases.test_contract]
enabled = false
command = ""
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]

[phases.accessibility]
enabled = false
command = ""
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]

[phases.performance]
enabled = false
command = ""
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]

[phases.bundle_size]
enabled = false
command = ""
when = ["changed", "scheduled", "manual"]
inputs = ["repository"]
